<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music I Love</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- Background -->
    <div class="background-effects">

        <img src="../images/background.png" alt="" class="flower-bg">

        <div class="grid"></div>
        <div class="red-glow"></div>

    </div>

    <!-- Characters -->
    <img src="../images/sharkface.png" alt="" class="armor-bg">

    <img src="../images/character.png" alt="" class="character-left">

    <!-- Music Page -->
    <div class="song-container">

        <a href="../index.html" class="back-button">
            ← BACK
        </a>

        <h1>MUSIC I LOVE</h1>

        <p class="song-subtitle">
            FAVORITE SONG
        </p>

        <div class="record" id="record">
            <div class="record-center">
                LIFEHOUSE
            </div>
        </div>

        <div class="song-info">

            <h2>COME BACK DOWN</h2>

            <p>LIFEHOUSE</p>

        </div>

        <button class="song-button" id="playButton" type="button">
            PLAY
        </button>

        <!-- Song -->
        <audio id="song">
            <source src="../images/come-back-down.mp3" type="audio/mpeg">
        </audio>

    </div>

    <script>

        const song = document.getElementById("song");
        const playButton = document.getElementById("playButton");
        const record = document.getElementById("record");

        playButton.addEventListener("click", function () {

            if (song.paused) {

                song.play();

                playButton.textContent = "PAUSE";
                record.classList.add("playing");

            } else {

                song.pause();

                playButton.textContent = "PLAY";
                record.classList.remove("playing");

            }

        });

        song.addEventListener("ended", function () {

            playButton.textContent = "PLAY";
            record.classList.remove("playing");

        });

    </script>
      <script src="script.js"></script>
</body>
</html>
